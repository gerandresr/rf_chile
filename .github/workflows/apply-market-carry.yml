name: Apply market carry patch
on:
  push:
    branches: [mercados-duracion-carry]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[carry-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mercados-duracion-carry
      - name: Patch MarketDashboard
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('components/MarketDashboard.tsx')
          s=p.read_text()
          s=s.replace('function MarketTable({ title, instruments, data }: { title: string; instruments: Instrument[]; data: RFData }) {', '''function formatDuration(value: number | null | undefined) {
            return value == null || !Number.isFinite(value) ? "—" : `${value.toLocaleString("es-CL", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
          }

          function carry1d(yieldPct: number | null | undefined, tpmPct: number | null, duration: number | null | undefined) {
            if (yieldPct == null || tpmPct == null || duration == null || !Number.isFinite(duration) || duration === 0) return null;
            return (((yieldPct / 100) / 365 - (tpmPct / 100) / 360) / duration) * 10000;
          }

          function formatCarry(value: number | null) {
            return value == null || !Number.isFinite(value) ? "—" : `${value.toLocaleString("es-CL", { minimumFractionDigits: 1, maximumFractionDigits: 1 })} bp`;
          }

          function MarketTable({ title, instruments, data, tpm }: { title: string; instruments: Instrument[]; data: RFData; tpm: number | null }) {''')
          s=s.replace('<thead><tr><th>Instrumento</th><th>Venc.</th><th>Yield</th><th>Δ Día</th><th>MTD</th><th>YTD</th></tr></thead>', '<thead><tr><th>Instrumento</th><th>Duración</th><th>Yield</th><th>Carry 1d</th><th>Δ Día</th><th>MTD</th><th>YTD</th></tr></thead>')
          s=s.replace('''                  <td>{maturityLabel(inst)}</td>
                  <td className="num strong">{formatPercent(s?.value, 3)}</td>
                  <td className="num"><Change value={s?.d1 ?? null} /></td>''', '''                  <td className="num">{formatDuration(inst.duration)}</td>
                  <td className="num strong">{formatPercent(s?.value, 3)}</td>
                  <td className="num">{formatCarry(carry1d(s?.value, tpm, inst.duration))}</td>
                  <td className="num"><Change value={s?.d1 ?? null} /></td>''')
          marker='''const macroKpis = [
  dailyTpmKpi(dailyMacroData),'''
          repl='''const latestTpm = [...dailyMacroData].reverse().find((row) => typeof row.tpm === "number")?.tpm ?? null;

const macroKpis = [
  dailyTpmKpi(dailyMacroData),'''
          s=s.replace(marker,repl)
          s=s.replace('<MarketTable title="Bonos de Gobierno en Pesos" instruments={btp} data={data} />', '<MarketTable title="Bonos de Gobierno en Pesos" instruments={btp} data={data} tpm={latestTpm} />')
          s=s.replace('<MarketTable title="Bonos de Gobierno en UF" instruments={btu} data={data} />', '<MarketTable title="Bonos de Gobierno en UF" instruments={btu} data={data} tpm={latestTpm} />')
          p.write_text(s)
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/apply-market-carry.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/MarketDashboard.tsx .github/workflows/apply-market-carry.yml
          git commit -m "Agrega duración y Carry 1d a tablas de bonos [carry-patch]"
          git push origin HEAD:mercados-duracion-carry
